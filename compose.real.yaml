services:
  model-service:
    build:
      context: ./services/model-service
      dockerfile: Dockerfile.real
    environment:
      RSVQA_MODEL_MODE: real
      RSVQA_RELEASE_MANIFEST: ${RSVQA_RELEASE_MANIFEST:?Set the immutable model-release.json path inside the mounted release directory}
      RSVQA_MODEL_DEVICE: ${RSVQA_MODEL_DEVICE:-cpu}
    healthcheck:
      start_period: 180s
      retries: 40
