[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-vqa-knowledge-service"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.0,<3.0",
  "pydantic>=2.9,<3.0",
  "pymilvus>=2.6,<2.7",
  "sentence-transformers>=5.0,<6.0",
  "torch>=2.2,<2.7",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
