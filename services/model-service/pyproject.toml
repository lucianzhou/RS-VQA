[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-vqa-model-service"
version = "0.3.0"
description = "Contract-validated runtime adapter for RS-VQA research model releases."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pillow>=11.0,<12.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
