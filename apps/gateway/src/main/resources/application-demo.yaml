server:
  servlet:
    session:
      cookie:
        secure: false
        http-only: true
        same-site: lax

rsvqa:
  demo-auth:
    enabled: ${RSVQA_DEMO_AUTH:true}
  demo-environment:
    enabled: ${RSVQA_DEMO_ENVIRONMENT_ENABLED:true}
    source-root: ${RSVQA_DEMO_DATA_ROOT:../../data/defense-benchmark-v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
