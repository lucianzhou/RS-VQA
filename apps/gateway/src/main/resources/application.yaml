server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: rs-vqa-gateway
  datasource:
    url: ${RSVQA_DATABASE_URL:jdbc:postgresql://localhost:5432/rsvqa}
    username: ${RSVQA_DATABASE_USER:rsvqa}
    password: ${RSVQA_DATABASE_PASSWORD:rsvqa_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Feature branches historically introduced V10 and V11 in parallel. This
    # allows an existing local V11 database to apply the now-canonical V10
    # normalization audit before V12 without repair or data loss.
    out-of-order: true
  data:
    redis:
      host: ${RSVQA_REDIS_HOST:localhost}
      port: ${RSVQA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 128MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ai:
    mcp:
      client:
        enabled: ${RSVQA_MCP_CLIENT_ENABLED:false}
        name: rs-vqa-mcp-client
        version: 0.3.0
        request-timeout: 10s
        type: SYNC
        streamable-http:
          connections:
            readonly-tools:
              url: ${RSVQA_MCP_REMOTE_URL:http://localhost:18080}
              endpoint: ${RSVQA_MCP_REMOTE_ENDPOINT:/mcp}
      server:
        enabled: ${RSVQA_MCP_ENABLED:false}
        name: rs-vqa-readonly-tools
        version: 0.3.0
        protocol: STATELESS
        type: SYNC
        annotation-scanner:
          enabled: true

rsvqa:
  gemini:
    # OpenAI-compatible relay endpoint. No host is compiled in; both the base URL
    # and the key are server-side only and never reach the browser.
    enabled: ${RSVQA_GEMINI_ENABLED:false}
    base-url: ${RSVQA_GEMINI_BASE_URL:}
    api-key: ${RSVQA_GEMINI_API_KEY:}
    completions-path: ${RSVQA_GEMINI_COMPLETIONS_PATH:/v1/chat/completions}
    # External vision VQA role. `model` has no default on purpose: a relay model
    # is only offered for image work after an operator has verified it accepts
    # image input. Leaving it empty keeps external vision UNCONFIGURED.
    vision:
      enabled: ${RSVQA_GEMINI_VISION_ENABLED:false}
      model: ${RSVQA_GEMINI_VISION_MODEL:}
      timeout-seconds: ${RSVQA_GEMINI_VISION_TIMEOUT_SECONDS:60}
      max-retries: ${RSVQA_GEMINI_VISION_MAX_RETRIES:2}
      max-output-tokens: ${RSVQA_GEMINI_VISION_MAX_OUTPUT_TOKENS:1024}
      temperature: ${RSVQA_GEMINI_VISION_TEMPERATURE:0.2}
    # RS-Bot text and tool-calling role. Independent of the vision role.
    agent:
      enabled: ${RSVQA_GEMINI_AGENT_ENABLED:false}
      model: ${RSVQA_GEMINI_AGENT_MODEL:gemini-3.6-flash}
      timeout-seconds: ${RSVQA_GEMINI_AGENT_TIMEOUT_SECONDS:90}
      max-retries: ${RSVQA_GEMINI_AGENT_MAX_RETRIES:2}
      max-output-tokens: ${RSVQA_GEMINI_AGENT_MAX_OUTPUT_TOKENS:2048}
      temperature: ${RSVQA_GEMINI_AGENT_TEMPERATURE:0.2}
  qwen:
    enabled: ${RSVQA_QWEN_ENABLED:false}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${RSVQA_QWEN_MODEL:qwen3-vl-32b-instruct}
    timeout-seconds: ${RSVQA_QWEN_TIMEOUT_SECONDS:60}
    max-retries: ${RSVQA_QWEN_MAX_RETRIES:2}
    max-output-tokens: ${RSVQA_QWEN_MAX_OUTPUT_TOKENS:1024}
    temperature: ${RSVQA_QWEN_TEMPERATURE:0.2}
  rs-bot:
    # Budgets for one planning run. An LLM tool loop has no natural stopping
    # point, so every one of these is load-bearing.
    max-tool-steps: ${RSVQA_RS_BOT_MAX_TOOL_STEPS:6}
    max-tool-calls-per-step: ${RSVQA_RS_BOT_MAX_TOOL_CALLS_PER_STEP:4}
    max-total-tokens: ${RSVQA_RS_BOT_MAX_TOTAL_TOKENS:40000}
    timeout-seconds: ${RSVQA_RS_BOT_TIMEOUT_SECONDS:120}
    max-tool-output-chars: ${RSVQA_RS_BOT_MAX_TOOL_OUTPUT_CHARS:24000}
  provider-policy:
    enabled: ${RSVQA_PROVIDER_POLICY_ENABLED:true}
    vision:
      requests-per-minute: ${RSVQA_PROVIDER_VISION_REQUESTS_PER_MINUTE:12}
      max-concurrent: ${RSVQA_PROVIDER_VISION_MAX_CONCURRENT:2}
      max-items-per-request: ${RSVQA_PROVIDER_VISION_MAX_ITEMS_PER_REQUEST:1}
      daily-token-budget: ${RSVQA_PROVIDER_VISION_DAILY_TOKEN_BUDGET:100000}
      token-reservation: ${RSVQA_PROVIDER_VISION_TOKEN_RESERVATION:8192}
    agent:
      requests-per-minute: ${RSVQA_PROVIDER_AGENT_REQUESTS_PER_MINUTE:20}
      max-concurrent: ${RSVQA_PROVIDER_AGENT_MAX_CONCURRENT:1}
      max-items-per-request: 1
      daily-token-budget: ${RSVQA_PROVIDER_AGENT_DAILY_TOKEN_BUDGET:200000}
      token-reservation: ${RSVQA_PROVIDER_AGENT_TOKEN_RESERVATION:40000}
    circuit:
      failure-threshold: ${RSVQA_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:3}
      open-duration: ${RSVQA_PROVIDER_CIRCUIT_OPEN_DURATION:PT30S}
    pricing:
      version: ${RSVQA_PROVIDER_PRICING_VERSION:unconfigured}
      models:
        "gemini/gemini-3.6-flash":
          input-usd-per-million: ${RSVQA_GEMINI_INPUT_USD_PER_MILLION:}
          output-usd-per-million: ${RSVQA_GEMINI_OUTPUT_USD_PER_MILLION:}
        "qwen/qwen3-vl-32b-instruct":
          input-usd-per-million: ${RSVQA_QWEN_INPUT_USD_PER_MILLION:}
          output-usd-per-million: ${RSVQA_QWEN_OUTPUT_USD_PER_MILLION:}
  model-service:
    base-url: ${RSVQA_MODEL_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 15
    max-file-bytes: 10485760
  storage:
    root: ${RSVQA_STORAGE_ROOT:./runtime/uploads}
  knowledge-service:
    base-url: ${RSVQA_KNOWLEDGE_SERVICE_URL:http://localhost:8010}
    timeout-seconds: 90
    default-index-version: ${RSVQA_KNOWLEDGE_INDEX_VERSION:rsvqa-knowledge-v2}
  demo-auth:
    enabled: ${RSVQA_DEMO_AUTH:false}
  demo-environment:
    enabled: ${RSVQA_DEMO_ENVIRONMENT_ENABLED:false}
    source-root: ${RSVQA_DEMO_DATA_ROOT:}
    model-release-id: ${RSVQA_DEMO_MODEL_RELEASE_ID:rsvqa-hr-qdrop15-predicted-soft-20260727-9b4ade2}
  mcp:
    enabled: ${RSVQA_MCP_ENABLED:false}
    bearer-token: ${RSVQA_MCP_BEARER_TOKEN:}
    principal: ${RSVQA_MCP_PRINCIPAL:}
  batch:
    recovery-enabled: ${RSVQA_BATCH_RECOVERY_ENABLED:true}
    lease-duration: ${RSVQA_BATCH_LEASE_DURATION:PT10M}
    recovery-interval: ${RSVQA_BATCH_RECOVERY_INTERVAL:PT30S}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
