spring:
  datasource:
    url: jdbc:h2:mem:rsvqa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

rsvqa:
  model-service:
    base-url: http://localhost:8000
    timeout-seconds: 2
    max-file-bytes: 10485760
  storage:
    root: ${java.io.tmpdir}/rsvqa-tests
  demo-auth:
    enabled: true
